name: Tests

# Runs the PHPUnit suite and the static checks on every PR and on push to 1.x.
#
# Until this existed, GitHub ran no tests at all for this module: only
# changelog, composer-audit and dependabot-automerge. The drupalcode pipeline
# was the single venue that could see a regression, and a repo whose only gate
# lives somewhere else is a repo where a PR can go green, merge and ship while
# the suite is broken. It also let the two venues disagree silently, which is
# how a sibling module shipped a release with six red jobs.
on:
  # No `branches:` filter on pull_request. That key filters the BASE branch, so
  # a PR stacked on another feature branch runs zero checks and then reports
  # itself CLEAN — a false green that has already cost us once (webcms#461).
  pull_request: { branches: ['**'] }
  push: { branches: ['1.x'] }

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (Drupal ${{ matrix.drupal }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      # Report every combination: a failure on one core version is a real
      # result, not a reason to hide the others.
      fail-fast: false
      matrix:
        include:
          # The floor of each declared range, plus the ceiling. The module
          # declares ^10.6 || ^11.3 in both composer.json and the info.yml.
          #
          # Every floor gets a leg, because a claim CI does not exercise is not
          # a claim — it is a promise nobody checked.
          #
          # `constraint` is spelled out per leg rather than derived from
          # `drupal`: ^11.3 means ">=11.3 <12" and resolves to 11.4, so an
          # "11.3" leg built that way silently retests the ceiling. A floor leg
          # pins its minor (~11.3.0); the ceiling leg deliberately floats (^11).
          #
          # phpunit is pinned per leg because Drupal 10's core-dev hard-requires
          # ^9.6. That version predates PHP 8 attributes and does not error on
          # one it cannot read — it ignores it, and quietly collects fewer
          # tests. This suite is annotation-only today (@group, @coversDefaultClass,
          # @covers) so both versions see all 5, but the count floor below is
          # what proves it rather than assuming it. Add an attribute without its
          # annotation and the 10.6 leg goes red, which is the point.
          - drupal: '10.6'
            constraint: '~10.6.0'
            php: '8.3'
            phpunit: '^9.6'
          - drupal: '11.3'
            constraint: '~11.3.0'
            php: '8.3'
            phpunit: '^11.5'
          - drupal: '11'
            constraint: '^11'
            php: '8.4'
            phpunit: '^11.5'

    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd: image module. pdo_sqlite/sqlite3: the kernel-test database.
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Scaffold a Drupal site
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.constraint }}
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:${DRUPAL_CONSTRAINT}" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          # Install the working copy, not the released package.
          composer config repositories.menu_autopilot path ../module

      - name: Install dependencies
        working-directory: drupal
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.constraint }}
          PHPUNIT_VERSION: ${{ matrix.phpunit }}
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          # -W (--with-all-dependencies): recommended-project ships a
          # composer.lock, so each require is a *partial* update and composer
          # refuses to move the transitive packages the lock pins. -W lets it.
          retry composer require -W --no-interaction --no-progress \
            "drupal/menu_autopilot:*@dev"
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:${DRUPAL_CONSTRAINT}" \
            "phpunit/phpunit:${PHPUNIT_VERSION}"

      - name: Assert the versions actually under test
        working-directory: drupal
        env:
          EXPECTED_DRUPAL: ${{ matrix.drupal }}
        run: |
          set -euo pipefail
          # require the autoloader inline: php ignores auto_prepend_file for -r
          # code, so loading it that way leaves Composer\InstalledVersions
          # undefined and the line fatals after echoing its label. No `|| true`
          # here: a probe that cannot answer must fail, not improvise.
          core="$(php -r 'require "vendor/autoload.php"; echo \Composer\InstalledVersions::getPrettyVersion("drupal/core");')"
          echo "Drupal core: ${core}"
          vendor/bin/phpunit --version

          # Assert, do not merely print. A leg named for a floor that quietly
          # resolved the ceiling is a leg testing nothing it claims to.
          case "${core}" in
            "${EXPECTED_DRUPAL}".*) ;;
            *) echo "::error::Leg claims Drupal ${EXPECTED_DRUPAL} but resolved ${core}. Fix matrix.constraint rather than this check."; exit 1 ;;
          esac

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          # A path repo can silently fall back to the registry package; if that
          # happened the suite would pass against code nobody changed.
          test -L web/modules/contrib/menu_autopilot \
            || { echo "::error::menu_autopilot is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/menu_autopilot

      - name: PHPUnit — Unit + Kernel (blocking)
        working-directory: drupal
        env:
          # Kernel tests need a database; SQLite keeps this hermetic with no
          # service container. Quoted: the value ends in a colon, which YAML
          # would otherwise read as a mapping key and refuse to parse at all.
          SIMPLETEST_DB: 'sqlite://localhost/:memory:'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          # A dropped suite must fail the build, not pass quietly. 18 tests
          # collect today, all in tests/src/Kernel. Raise this deliberately as
          # the suite grows; never lower it to make a red run green.
          MIN_TESTS: '18'
        run: |
          set -euo pipefail
          # One invocation per directory: PHPUnit 9.6 takes a *single*
          # <directory|file> argument while 10+ accept a list, and passing two
          # to 9.6 does not error — it silently runs the first and ignores the
          # rest. Green, on part of the suite.
          # Absolute -c path: kernel tests may run in separate processes, and a
          # child does not inherit this working directory. 9.6 passes a relative
          # config path straight through, so every child dies on it.
          config="${PWD}/web/core/phpunit.xml.dist"
          module="${PWD}/web/modules/contrib/menu_autopilot"

          # Directories are discovered, not listed. This module has no
          # submodules today; when it grows one, its tests get picked up without
          # anyone remembering to edit this file. A sibling module hard-coded
          # two paths and left three submodule suites ungated for months, with a
          # count floor that could not notice because it counted the same two.
          suites=()
          for dir in "${module}"/tests/src/Unit "${module}"/tests/src/Kernel \
                     "${module}"/modules/*/tests/src/Unit "${module}"/modules/*/tests/src/Kernel; do
            [ -d "${dir}" ] && suites+=("${dir}")
          done
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::No test directories found under ${module}. The path is wrong, or the checkout is not what it should be."
            exit 1
          fi

          i=0
          for dir in "${suites[@]}"; do
            i=$((i + 1))
            echo "--- ${dir#"${module}/"}"
            vendor/bin/phpunit -c "${config}" \
              --log-junit "${PWD}/junit-${i}.xml" \
              "${dir}"
          done

          # Assert the *count*, not the exit status. An exit code only says the
          # tests that ran passed; it cannot say which ran. JUnit XML is used
          # because its shape is stable across 9.6 and 11, unlike the summary
          # line — and the count is what proves both PHPUnit versions collected
          # the same suite.
          total="$(cat junit-*.xml | grep -ho '<testcase ' | wc -l | tr -d ' ')"
          echo "Collected ${total} tests across ${#suites[@]} directories (floor ${MIN_TESTS})."
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Collected only ${total} tests, below the floor of ${MIN_TESTS}. The suite was dropped, not fixed — a passing run on a partial suite is a false green. Investigate before raising or removing this floor."
            exit 1
          fi

  phpcs:
    name: Drupal coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHPCS + the Drupal standard
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer drupal/coder

      - name: phpcs
        working-directory: module
        run: |
          # The module's own phpcs.xml.dist, so this and the drupalcode phpcs
          # job check the same ruleset rather than two similar ones.
          ~/.composer/vendor/bin/phpcs --standard=phpcs.xml.dist -p

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      # phpstan-drupal needs a real Drupal tree to resolve core classes.
      # Analysing the module on its own reports hundreds of "class not found"
      # errors and tells you nothing about the module.
      - name: Scaffold a Drupal site
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:^11" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config repositories.menu_autopilot path ../module

      - name: Install dependencies
        working-directory: drupal
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          retry composer require -W --no-interaction --no-progress \
            "drupal/menu_autopilot:*@dev"
          # drush is required, not optional: the module ships Drush commands
          # under src/Drush/Commands, and without it phpstan cannot resolve
          # Drush\Attributes\Command, DrushCommands::logger() or dt() — 15
          # errors that say nothing about this module's code. The drupalcode
          # phpstan job has drush in its environment, so leaving it out here
          # made the two venues disagree about a module that had not changed.
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:^11" \
            "drush/drush:^13" \
            "phpstan/phpstan:^2" \
            "phpstan/extension-installer:^1.4" \
            "mglaman/phpstan-drupal:^2" \
            "phpstan/phpstan-deprecation-rules:^2"

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          test -L web/modules/contrib/menu_autopilot \
            || { echo "::error::menu_autopilot is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/menu_autopilot

      - name: phpstan
        working-directory: drupal
        run: |
          set -euo pipefail
          # The module's own phpstan.neon.dist, so this and the drupalcode
          # phpstan job answer the same question.
          vendor/bin/phpstan analyze web/modules/contrib/menu_autopilot \
            -c web/modules/contrib/menu_autopilot/phpstan.neon.dist \
            --autoload-file=vendor/autoload.php \
            --no-progress \
            --memory-limit=2G
