################
# Drupal GitLabCI template for contrib modules.
#
# Replicates DrupalCI testing via the centrally maintained include files.
# https://www.drupal.org/docs/develop/git/using-gitlab-to-contribute-to-drupal
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _GITLAB_TEMPLATES_REPO: project/gitlab_templates
  _GITLAB_TEMPLATES_REF: main
  # This module declares `^10.6 || ^11.3 || ^12`. A support claim CI does not
  # exercise is not a claim, so each live branch of that constraint gets a job.
  # OPT_IN_* surfaces the job; _AUTORUN_* ('all') makes it run automatically
  # instead of staying manual.
  # PREVIOUS_MAJOR = newest 10.x satisfying core_version_requirement (10.6, D10 floor);
  # PREVIOUS_MINOR = prior minor of the current major (11.3, D11 floor).
  OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MAJOR: 'all'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # The `^12` half of the constraint. Deliberately MANUAL rather than autorun:
  # Drupal 12 is still a moving beta (12.0.0-beta2 as of this change), and a
  # pipeline that goes red on upstream churn teaches nothing and trains people
  # to ignore the badge. Run it before tagging, and drop `^12` from the
  # constraint if it stops passing. The 10.6 and 11.3 floors stay autorun.
  OPT_IN_TEST_NEXT_MAJOR: '1'
  # Forward-compat signal on the upcoming minor, available on demand (manual).
  OPT_IN_TEST_NEXT_MINOR: '1'
  # Dictionary is now complete for the words job 12543234 reported. Make the
  # job blocking so a new misspelling cannot sit amber and mail every pipeline.
  _CSPELL_ALLOW_FAILURE: '0'

# composer (previous major) uses CORE_PREVIOUS_PHP_MIN (8.1) by default. That
# matches composer.json "php": ">=8.1" and Drupal 10.6's floor. Pin it so a
# templates bump cannot move the lane onto 8.3 (or off 8.1) and silently stop
# exercising the declared floor. Do not skip, allow_failure, or raise the
# php/core constraint: job 12543226 on pipeline 982780 already installed
# Drupal 10.6.18 on PHP 8.1.34. Raising the floor would drop real D10/8.1
# sites; skipping would leave ^10.6 unverified on drupalcode.
composer (previous major):
  variables:
    PHP_VERSION: '8.1'

# phpstan / phpstan (previous major) use phpstan.neon, which excludes
# modules/menu_autopilot_mcp. Do not add drupal/mcp_sentinel or drupal/tool
# to require-dev to "fix" those jobs: tool requires PHP >=8.2 and
# mcp_sentinel requires PHP 8.3+, which would fail this PHP 8.1 lane.
# Do not set SKIP_PHPSTAN. GitHub phpstan still analyzes the tools.
